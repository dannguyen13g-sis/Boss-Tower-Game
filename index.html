<title>Hollowmere Town Map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grenze:wght@600;700&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: twilight cartography. A hand-painted canvas map is the hero; a brass-trimmed ledger panel sits beside it (below on phones). Single committed dark look. */
:root{
  --night:#121619;
  --panel:#1a1f24;
  --panel-2:#222930;
  --line:#343e47;
  --text:#ebe4d4;
  --muted:#a0a79d;
  --brass:#d9a441;
  --brass-ink:#1b1408;
  --hp:#d0483a;
  --good:#71c48e;
  --arcane:#a58ae6;
  --font-display:"Grenze", "Palatino Linotype", Georgia, serif;
  --font-body:"Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--night)}
body{color:var(--text);font-family:var(--font-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 32px}
.wrap{max-width:1480px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font-family:var(--font-display);font-weight:700;font-size:clamp(28px,4vw,40px);line-height:1;margin:0;letter-spacing:.01em;color:var(--brass)}
.tag{margin:4px 0 0;color:var(--muted);font-size:14px}
.hud{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 10px;font-variant-numeric:tabular-nums;font-weight:500}
.chip b{font-weight:700}
.chip .k{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.hpbar{width:90px;height:8px;background:#3a2422;border-radius:4px;overflow:hidden}
.hpbar i{display:block;height:100%;background:var(--hp);transition:width .3s}
.coin{width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe08a,var(--brass) 60%,#8a6420)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:16px;align-items:start}
@media (max-width:1100px){.layout{grid-template-columns:minmax(0,1fr)}}
.mapscroll{overflow-x:auto;border-radius:10px;border:1px solid var(--line);background:#2b3a2c}
.map{position:relative;min-width:760px;aspect-ratio:3/2;max-width:100%}
@media (max-width:820px){.map{max-width:none}}
.map canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#fx{cursor:pointer}
.pin{position:absolute;transform:translate(-50%,0);font-family:var(--font-display);font-weight:600;font-size:clamp(13px,1.25vw,17px);
  background:rgba(18,22,25,.86);color:var(--text);border:1px solid rgba(217,164,65,.55);border-radius:5px;padding:3px 10px 4px;white-space:nowrap;cursor:pointer;
  box-shadow:0 2px 8px rgba(0,0,0,.4);transition:background .15s,color .15s,transform .15s}
.pin small{display:block;font-family:var(--font-body);font-weight:500;font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;line-height:1.1}
.pin:hover{background:var(--panel-2);transform:translate(-50%,-2px)}
.pin.active{background:var(--brass);color:var(--brass-ink);border-color:var(--brass)}
.pin.active small{color:#4a3510}
.pin:focus-visible,.btn:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.hint{color:var(--muted);font-size:13px;margin:6px 2px 0}
aside{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;min-width:0}
.ph{padding:16px 18px 12px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,var(--panel-2),var(--panel))}
.ph .eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--brass)}
.ph h2{font-family:var(--font-display);font-size:28px;line-height:1.05;margin:2px 0 4px;text-wrap:balance}
.ph p{margin:0;color:var(--muted);font-size:14px}
.pb{padding:14px 18px 18px;display:flex;flex-direction:column;gap:14px}
.sec h3{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 6px;font-weight:700}
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .n{font-weight:700}
.row .d{color:var(--muted);font-size:13px}
.price{font-variant-numeric:tabular-nums;color:var(--brass);font-weight:700}
.btn{font:inherit;font-weight:700;font-size:14px;border-radius:5px;padding:6px 12px;cursor:pointer;border:1px solid var(--brass);background:transparent;color:var(--brass);white-space:nowrap}
.btn:hover:not(:disabled){background:rgba(217,164,65,.12)}
.btn.primary{background:var(--brass);color:var(--brass-ink)}
.btn.primary:hover:not(:disabled){background:#e8b553}
.btn.danger{border-color:var(--hp);color:#f08a7f}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.pips{display:inline-flex;gap:3px;vertical-align:middle;margin-left:6px}
.pips i{width:9px;height:9px;border-radius:2px;background:var(--line)}
.pips i.on{background:var(--brass)}
.status{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:4px;border:1px solid var(--line);color:var(--muted)}
.status.ok{color:var(--good);border-color:rgba(113,196,142,.45)}
.status.boss{color:#f08a7f;border-color:rgba(208,72,58,.5)}
.fight{background:var(--panel-2);border:1px solid rgba(208,72,58,.45);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px}
.fighter{display:grid;grid-template-columns:90px minmax(0,1fr) auto;gap:8px;align-items:center;font-variant-numeric:tabular-nums}
.bar{height:10px;background:#2b2f34;border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--hp);transition:width .25s}
.bar.foe i{background:var(--arcane)}
.log{font-size:13px;color:var(--muted);max-height:150px;overflow:auto;display:flex;flex-direction:column;gap:2px;margin:0;padding:0;list-style:none}
.log li:first-child{color:var(--text)}
.flavor{font-style:italic;color:var(--muted);margin:0;font-size:14px}
.note{font-size:13px;color:var(--muted);margin:0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--panel-2);border:1px solid var(--brass);color:var(--text);padding:9px 16px;border-radius:6px;font-weight:500;box-shadow:0 6px 20px rgba(0,0,0,.5);max-width:calc(100% - 32px);z-index:20}
footer{display:flex;justify-content:flex-end}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header>
    <div>
      <h1>Hollowmere</h1>
      <p class="tag">A river town under the shadow of the Hollow Tower. Pick a place on the map.</p>
    </div>
    <div class="hud" id="hud" aria-live="polite"></div>
  </header>

  <div class="layout">
    <div>
      <div class="mapscroll">
        <div class="map" id="map">
          <canvas id="base" aria-hidden="true"></canvas>
          <canvas id="fx" role="img" aria-label="Painted map of Hollowmere showing the forge, training hall, apothecary, guild hall, town square and the Hollow Tower across the river"></canvas>
        </div>
      </div>
      <p class="hint">Climb the tower floor by floor. Earn gold from hunts and bounties at the Guild Hall, then spend it at the forge, the training hall and the apothecary.</p>
    </div>
    <aside id="panel" aria-live="polite"></aside>
  </div>
  <footer><button class="btn danger" id="reset">Start a new game</button></footer>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
const W=1200,H=800;
const LOC={
  square:{name:"Lantern Square",sub:"Town centre · Inn",x:600,y:480,ly:560,r:85},
  blacksmith:{name:"Ironhook Forge",sub:"Blacksmith",x:300,y:545,ly:560,r:80},
  upgrades:{name:"Training Hall",sub:"Upgrades",x:330,y:300,ly:315,r:90},
  potions:{name:"Mossbottle Apothecary",sub:"Potion shop",x:885,y:590,ly:605,r:80},
  quests:{name:"Guild Hall",sub:"Quests",x:705,y:330,ly:345,r:80},
  tower:{name:"The Hollow Tower",sub:"Boss tower",x:1010,y:250,ly:262,r:80}
};
const WEAPONS=[
  {n:"Rusty Dagger",b:0,p:0,d:"Your grandfather's. Mostly rust."},
  {n:"Iron Sword",b:3,p:60,d:"Honest steel, folded once."},
  {n:"Steel Longsword",b:7,p:160,d:"Balanced for two-handed swings."},
  {n:"Runeblade",b:13,p:400,d:"Etched with wards against the dead."}  
];
const ARMOR=[
  {n:"Travel Tunic",b:0,p:0,d:"Keeps the rain off. Barely."},
  {n:"Boiled Leather",b:2,p:50,d:"Stiff, cheap, reliable."},
  {n:"Chainmail",b:5,p:140,d:"Rings of riveted iron."},
  {n:"Tower Plate",b:9,p:360,d:"Forged to survive the climb."}
];
const UPG=[
  {k:"vit",n:"Vitality drills",d:"+10 max HP",base:200},
  {k:"str",n:"Blade forms",d:"+2 ATK",base:200},
  {k:"grd",n:"Shield work",d:"+1 DEF",base:200}
];
const POTS=[
  {k:"heal",n:"Healing Draught",d:"Restores 30 HP",p:50},
  {k:"greater",n:"Greater Remedy",d:"Restores all HP",p:100},
  {k:"tonic",n:"Bull's Blood Tonic",d:"+5 ATK for one tower fight",p:150}
];
const FLOORS=[
  {n:"Cellar Rat-King",hp:50,atk:5,g:500,f:"Fat on tower scraps and very proud of it."},
  {n:"Skeleton Warden",hp:60,atk:10,g:500,f:"Still guarding a door no one remembers."},
  {n:"Cursed Knight",hp:75,atk:15,g:500,f:"His oath outlived him."},
  {n:"Gloam Wraith",hp:100,atk:25,g:500,f:"Cold enough to frost your breath at ten paces."},
  {n:"The Hollow King",hp:250,atk:35,g:500,f:"The crown is the only part of him still solid.",boss:true}
  {n:"Ice Dragon",hp:200:,atk:50,g:500,f:"Breathes ice spikes at a temperture of absolute zero."},
  {n:"Zombie Queen",hp:280,atk:80,g:500,f:""},
  {n:"Mad Scientist",hp:320,atk:100,g:500,f:"Has potions from 1000 years in the future."},
  {n:"The Unknown",hp:390,atk:100,g:500,f:"No one has ever unveiled his idenity."},
  {n:"Grim Reaper",hp:525,atk:120,g:500,f:"Taken 2499 lives. Your's may be #2500.",boss:true}
];
const BOUNTIES=[
  {id:"arm",n:"Arm yourself",d:"Buy a new weapon at Ironhook Forge.",g:40,goal:1,v:s=>s.weapon>0?1:0},
  {id:"hunt",n:"Thin the wolf packs",d:"Hunt in the Thornwood 3 times.",g:45,goal:3,v:s=>s.hunts},
  {id:"stock",n:"Stock the satchel",d:"Buy 3 potions at the apothecary.",g:30,goal:3,v:s=>s.bought},
  {id:"f1",n:"First rung",d:"Clear floor 1 of the Hollow Tower.",g:50,goal:1,v:s=>Math.min(1,s.cleared)},
  {id:"train",n:"Train hard",d:"Finish 3 lessons at the Training Hall.",g:80,goal:3,v:s=>s.up.vit+s.up.str+s.up.grd},
  {id:"f3",n:"Into the dark",d:"Clear floor 3 of the tower.",g:120,goal:3,v:s=>s.cleared},
  {id:"king",n:"End the Hollow King",d:"Defeat the boss on floor 5.",g:500,goal:5,v:s=>s.cleared}
];
const KEY="hollowmere-save-v1";
function fresh(){return {gold:120,hp:40,weapon:0,armor:0,up:{vit:0,str:0,grd:0},pot:{heal:1,greater:0,tonic:0},cleared:0,hunts:0,bought:0,claimed:{},fight:null,sel:"square"}}
let S=fresh();
try{const raw=localStorage.getItem(KEY);if(raw){S=Object.assign(fresh(),JSON.parse(raw));}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const maxHp=()=>40+S.up.vit*10;
const atk=()=>4+WEAPONS[S.weapon].b+S.up.str*2+(S.fight&&S.fight.tonic?5:0);
const def=()=>ARMOR[S.armor].b+S.up.grd;
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const upCost=u=>u.base*(S.up[u.k]+1);

/* ---------- toast ---------- */
const toastEl=document.getElementById("toast");let tt;
function toast(m){toastEl.textContent=m;toastEl.hidden=false;clearTimeout(tt);tt=setTimeout(()=>toastEl.hidden=true,2600)}

/* ---------- HUD ---------- */
function hud(){
  const mh=maxHp();
  const potCount=S.pot.heal+S.pot.greater+S.pot.tonic;
  document.getElementById("hud").innerHTML=
   `<span class="chip"><span class="coin"></span><b>${S.gold}</b>&nbsp;gold</span>
    <span class="chip"><span class="k">HP</span><span class="hpbar"><i style="width:${Math.max(0,S.hp/mh*100)}%"></i></span><b>${S.hp}/${mh}</b></span>
    <span class="chip"><span class="k">ATK</span><b>${atk()}</b></span>
    <span class="chip"><span class="k">DEF</span><b>${def()}</b></span>
    <span class="chip"><span class="k">Potions</span><b>${potCount}</b></span>
    <span class="chip"><span class="k">Tower</span><b>${S.cleared}/5</b></span>`;
}

/* ---------- panel ---------- */
const panel=document.getElementById("panel");
function head(k,eyebrow,flavor){const L=LOC[k];return `<div class="ph"><div class="eyebrow">${eyebrow}</div><h2>${L.name}</h2><p>${flavor}</p></div>`}
function render(){
  hud();
  document.querySelectorAll(".pin").forEach(p=>p.classList.toggle("active",p.dataset.loc===S.sel));
  const k=S.sel;let h="";
  if(k==="square"){
    const mh=maxHp();
    h=head(k,"Town centre","Lanterns never go out here. The Sleeping Heron inn faces the fountain.")+
    `<div class="pb"><div class="sec"><h3>The Sleeping Heron</h3><div class="rows">
      <div class="row"><div><div class="n">Rent a bed</div><div class="d">Sleep until morning and wake at full health.</div></div>
      <button class="btn primary" data-a="rest" ${S.hp>=mh||S.gold<10||S.fight?"disabled":""}>Rest · <span class="price" style="color:inherit">10g</span></button></div>
    </div></div>
    <div class="sec"><h3>Roads out of the square</h3><div class="rows">
      ${["blacksmith","upgrades","potions","quests","tower"].map(x=>`<div class="row"><div><div class="n">${LOC[x].name}</div><div class="d">${LOC[x].sub}</div></div><button class="btn" data-go="${x}">Go</button></div>`).join("")}
    </div></div></div>`;
  }
  else if(k==="blacksmith"){
    const list=(arr,cur,kind,stat)=>arr.map((it,i)=>{
      let b;if(i===cur)b=`<span class="status ok">Equipped</span>`;
      else if(i<cur)b=`<span class="status">Outclassed</span>`;
      else b=`<button class="btn primary" data-a="buy-${kind}" data-i="${i}" ${S.gold<it.p?"disabled":""}>Buy · ${it.p}g</button>`;
      return `<div class="row"><div><div class="n">${it.n} <span class="price">+${it.b} ${stat}</span></div><div class="d">${it.d}</div></div>${b}</div>`}).join("");
    h=head(k,"Blacksmith","Old Brannoc works the anvil from dawn. Each piece replaces the one you carry.")+
    `<div class="pb"><div class="sec"><h3>Weapons</h3><div class="rows">${list(WEAPONS,S.weapon,"w","ATK")}</div></div>
     <div class="sec"><h3>Armour</h3><div class="rows">${list(ARMOR,S.armor,"a","DEF")}</div></div></div>`;
  }
  else if(k==="upgrades"){
    h=head(k,"Upgrades","Sergeant Vey trains anyone who pays. Lessons are permanent, up to five of each.")+
    `<div class="pb"><div class="sec"><h3>Lessons</h3><div class="rows">${UPG.map(u=>{const lv=S.up[u.k],maxed=lv>=5;
      return `<div class="row"><div><div class="n">${u.n}<span class="pips">${[0,1,2,3,4].map(i=>`<i class="${i<lv?"on":""}"></i>`).join("")}</span></div><div class="d">${u.d} per lesson</div></div>
      ${maxed?`<span class="status ok">Mastered</span>`:`<button class="btn primary" data-a="up" data-k="${u.k}" ${S.gold<upCost(u)?"disabled":""}>Train · ${upCost(u)}g</button>`}</div>`}).join("")}</div></div>
      <p class="note">Lesson prices rise with each level.</p></div>`;
  }
  else if(k==="potions"){
    h=head(k,"Potion shop","Widow Marrow brews in the back. The green ones are safe. Probably.")+
    `<div class="pb"><div class="sec"><h3>On the shelf</h3><div class="rows">${POTS.map(p=>`<div class="row"><div><div class="n">${p.n} <span class="d">· you have ${S.pot[p.k]}</span></div><div class="d">${p.d}</div></div>
      <button class="btn primary" data-a="pot" data-k="${p.k}" ${S.gold<p.p?"disabled":""}>Buy · ${p.p}g</button></div>`).join("")}</div></div>
     <div class="sec"><h3>Drink now</h3><div class="btns">
      <button class="btn" data-a="drink" data-k="heal" ${!S.pot.heal||S.hp>=maxHp()?"disabled":""}>Healing Draught</button>
      <button class="btn" data-a="drink" data-k="greater" ${!S.pot.greater||S.hp>=maxHp()?"disabled":""}>Greater Remedy</button></div>
      <p class="note" style="margin-top:6px">Tonics are drunk inside the tower, at the start of a fight.</p></div></div>`;
  }
  else if(k==="quests"){
    const hg=`${15+6*S.cleared}–${30+6*S.cleared}`;
    h=head(k,"Quests","The guild board is papered three layers deep. Claim a bounty here once its work is done.")+
    `<div class="pb"><div class="sec"><h3>Repeatable work</h3><div class="rows"><div class="row"><div><div class="n">Hunt in the Thornwood</div><div class="d">Earn ${hg} gold. Wolves bite for 6–14, less your DEF.</div></div>
      <button class="btn primary" data-a="hunt" ${S.hp<=14||S.fight?"disabled":""}>Hunt</button></div></div>
      ${S.hp<=14?`<p class="note">You are too wounded to hunt. Rest at the inn or drink a potion.</p>`:""}</div>
     <div class="sec"><h3>Bounties</h3><div class="rows">${BOUNTIES.map(b=>{const v=Math.min(b.goal,b.v(S)),done=v>=b.goal,cl=S.claimed[b.id];
      return `<div class="row"><div><div class="n">${b.n} <span class="price">${b.g}g</span></div><div class="d">${b.d} · ${v}/${b.goal}</div></div>
      ${cl?`<span class="status ok">Claimed</span>`:done?`<button class="btn primary" data-a="claim" data-k="${b.id}">Claim</button>`:`<span class="status">Open</span>`}</div>`}).join("")}</div></div></div>`;
  }
  else if(k==="tower"){
    const f=S.fight;let body="";
    if(f){const F=FLOORS[f.floor];const mh=maxHp();
      body=`<div class="fight"><div class="sec"><h3>Floor ${f.floor+1}${F.boss?" · Boss":""}</h3><div class="n" style="font-family:var(--font-display);font-size:22px">${F.n}</div><p class="flavor">${F.f}</p></div>
      <div class="fighter"><span>You</span><span class="bar"><i style="width:${S.hp/mh*100}%"></i></span><b>${S.hp}/${mh}</b></div>
      <div class="fighter"><span>${F.boss?"Boss":"Foe"}</span><span class="bar foe"><i style="width:${f.ehp/F.hp*100}%"></i></span><b>${f.ehp}/${F.hp}</b></div>
      <div class="btns"><button class="btn primary" data-a="hit">Attack</button>
        <button class="btn" data-a="fdrink" data-k="heal" ${!S.pot.heal?"disabled":""}>Draught (${S.pot.heal})</button>
        <button class="btn" data-a="fdrink" data-k="greater" ${!S.pot.greater?"disabled":""}>Remedy (${S.pot.greater})</button>
        ${f.tonic?"":`<button class="btn" data-a="tonic" ${!S.pot.tonic?"disabled":""}>Tonic (${S.pot.tonic})</button>`}
        <button class="btn danger" data-a="flee">Flee</button></div>
      <ul class="log">${f.log.map(l=>`<li>${l}</li>`).join("")}</ul></div>`;
    } else if(S.cleared>=5){
      body=`<div class="fight" style="border-color:var(--brass)"><div class="n" style="font-family:var(--font-display);font-size:24px;color:var(--brass)">The tower is silent.</div><p class="flavor">The Hollow King's crown lies cold on the top floor. Hollowmere sleeps easy tonight.</p></div>`;
    } else {
      const F=FLOORS[S.cleared];
      body=`<div class="btns"><button class="btn primary" data-a="climb" ${S.hp<=0?"disabled":""}>Climb to floor ${S.cleared+1}: ${F.n}</button></div>
      <p class="note">If you fall, the town watch carries you home and keeps a quarter of your gold for the trouble.</p>`;
    }
    h=head(k,"Boss tower","Five floors of stone and worse. Each floor's guardian must fall before the next stair opens.")+
    `<div class="pb">${body}<div class="sec"><h3>Floors</h3><div class="rows">${FLOORS.map((F,i)=>{const st=i<S.cleared?`<span class="status ok">Cleared</span>`:F.boss?`<span class="status boss">Boss</span>`:i===S.cleared?`<span class="status">Next</span>`:`<span class="status">Sealed</span>`;
      return `<div class="row"><div><div class="n">${i+1}. ${F.n}</div><div class="d">${F.hp} HP · ${F.atk} ATK · reward ${F.g}g</div></div>${st}</div>`}).join("")}</div></div></div>`;
  }
  panel.innerHTML=h;
  drawFx(performance.now());
}

/* ---------- actions ---------- */
function lose(){
  const lost=Math.floor(S.gold*0.25);S.gold-=lost;S.hp=Math.ceil(maxHp()/2);S.fight=null;S.sel="square";
  toast(`You fell. The watch carried you to Lantern Square and kept ${lost} gold.`);
}
function foeTurn(f){

    const aura=g.createRadialGradient(x,y-110,10,x,y-110,150);aura.addColorStop(0,"rgba(150,90,220,.32)");aura.addColorStop(1,"rgba(150,90,220,0)");
    g.fillStyle=aura;g.fillRect(x-160,y-270,320,300);
    shadow(x,y,58);
    poly([[x-44,y],[x-34,y-160],[x+34,y-160],[x+44,y]],"#2e2a36");
    poly([[x+6,y],[x+8,y-160],[x+34,y-160],[x+44,y]],"#221f29");
    g.fillStyle="rgba(255,255,255,.06)";for(let yy=y-150;yy<y;yy+=22)g.fillRect(x-42,yy,84,3);
    g.fillStyle="#2e2a36";g.fillRect(x-42,y-176,84,18);
    for(let i=-42;i<42;i+=16)g.fillRect(x+i,y-188,9,14);
    poly([[x-30,y-176],[x,y-232],[x+30,y-176]],"#1a1620");
    g.fillStyle="#120f16";g.fillRect(x-1.5,y-246,3,16);poly([[x+1,y-246],[x+18,y-240],[x+1,y-234]],"#8f2a2a");
    g.fillStyle="#151219";g.beginPath();g.moveTo(x-14,y);g.lineTo(x-14,y-26);g.arc(x,y-26,14,Math.PI,0);g.lineTo(x+14,y);g.closePath();g.fill();
    TOWER_WIN.forEach(([dx,dy])=>{g.fillStyle="#3a0f12";g.fillRect(x+dx-5,y+dy-9,10,18)});
  },
  inn(x,y){
    shadow(x,y,48);
    g.fillStyle="#a89775";g.fillRect(x-36,y-40,72,40);
    g.fillStyle="#4b3420";g.fillRect(x-36,y-40,72,4);
    poly([[x-44,y-38],[x,y-74],[x+44,y-38]],"#3c4a3a");poly([[x,y-74],[x+44,y-38],[x+12,y-38]],"#2f3b2e");
    g.fillStyle="#f2c46a";g.fillRect(x-24,y-28,10,10);g.fillRect(x+14,y-28,10,10);
    g.fillStyle="#2e1f14";g.fillRect(x-7,y-22,14,22);
    g.fillStyle="#3b2a1b";g.fillRect(x+36,y-30,16,3);g.fillStyle="#d9a441";g.fillRect(x+42,y-27,10,10);
  }
};
const TOWER_WIN=[[0,-70],[-16,-120],[16,-120],[0,-150],[-14,-40]];
const LANTERNS=[[540,420],[660,420],[540,545],[660,545]];

/* ---------- animated layer ---------- */
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
const smoke=[];
function drawFx(t){
  x2.clearRect(0,0,W,H);
  const s=t/1000;
  // selection ring
  const L=LOC[S.sel];
  if(L){x2.save();x2.strokeStyle="rgba(217,164,65,.9)";x2.lineWidth=2.5;x2.setLineDash([10,8]);x2.lineDashOffset=reduce?0:-s*20;
    x2.beginPath();x2.ellipse(L.x,L.y+2,L.r,L.r*0.3,0,0,7);x2.stroke();x2.restore()}
  // forge smoke
  const sm=LOC.blacksmith;
  smoke.forEach(p=>{x2.fillStyle=`rgba(190,190,185,${p.a})`;x2.beginPath();x2.arc(p.x,p.y,p.r,0,7);x2.fill()});
  // forge glow
  const fg=x2.createRadialGradient(sm.x,sm.y-14,2,sm.x,sm.y-14,55);fg.addColorStop(0,`rgba(255,150,60,${.35+.12*Math.sin(s*7)})`);fg.addColorStop(1,"rgba(255,150,60,0)");x2.fillStyle=fg;x2.fillRect(sm.x-60,sm.y-70,120,90);
  // cauldron bubbles
  const pc=LOC.potions;
  for(let i=0;i<4;i++){const ph=(s*0.9+i*0.27)%1;x2.fillStyle=`rgba(120,230,160,${0.8*(1-ph)})`;x2.beginPath();x2.arc(pc.x-80+i*6,pc.y-18-ph*24,2+ph*3,0,7);x2.fill()}
  // tower windows
  const tw=LOC.tower;
  TOWER_WIN.forEach(([dx,dy],i)=>{const a=reduce?.8:.55+.45*Math.sin(s*2+i*1.3);
    const gr=x2.createRadialGradient(tw.x+dx,tw.y+dy,1,tw.x+dx,tw.y+dy,22);gr.addColorStop(0,`rgba(255,70,50,${a*.7})`);gr.addColorStop(1,"rgba(255,70,50,0)");x2.fillStyle=gr;x2.fillRect(tw.x+dx-22,tw.y+dy-22,44,44);
    x2.fillStyle=`rgba(255,${90+60*a|0},70,${a})`;x2.fillRect(tw.x+dx-4,tw.y+dy-8,8,16)});
  // boss-cleared: stop the menace
  // lanterns
  LANTERNS.forEach(([lx,ly],i)=>{x2.fillStyle="#2a2016";x2.fillRect(lx-1.5,ly-22,3,22);
    const a=reduce?.9:.75+.25*Math.sin(s*3+i);const gr=x2.createRadialGradient(lx,ly-24,1,lx,ly-24,26);gr.addColorStop(0,`rgba(255,200,110,${a*.6})`);gr.addColorStop(1,"rgba(255,200,110,0)");
    x2.fillStyle=gr;x2.fillRect(lx-26,ly-50,52,52);x2.fillStyle="#ffd98a";x2.fillRect(lx-3,ly-28,6,7)});
  // fountain sparkle
  const fq=LOC.square;x2.strokeStyle="rgba(200,235,250,.5)";x2.lineWidth=1.5;
  for(let i=0;i<3;i++){const r=((s*0.6+i/3)%1)*16+3;x2.globalAlpha=1-r/19;x2.beginPath();x2.arc(fq.x,fq.y,r,0,7);x2.stroke()}x2.globalAlpha=1;
}
function tick(t){
  const sm=LOC.blacksmith;
  if(Math.random()<0.25)smoke.push({x:sm.x+32+Math.random()*4,y:sm.y-114,r:4,a:.45,vx:.25+Math.random()*.3});
  for(let i=smoke.length-1;i>=0;i--){const p=smoke[i];p.y-=.5;p.x+=p.vx;p.r+=.08;p.a-=.004;if(p.a<=0)smoke.splice(i,1)}
  drawFx(t);requestAnimationFrame(tick);
}
fx.addEventListener("click",e=>{
  const r=fx.getBoundingClientRect(),mx=(e.clientX-r.left)/r.width*W,my=(e.clientY-r.top)/r.height*H;
  let best=null,bd=1e9;Object.entries(LOC).forEach(([k,L])=>{const d=Math.hypot(mx-L.x,(my-(L.y-40))*0.9);if(d<L.r+20&&d<bd){bd=d;best=k}});
  if(best)select(best);
});

function boot(){drawBase();render();if(!reduce)requestAnimationFrame(tick)}
if(document.fonts&&document.fonts.load){Promise.all([document.fonts.load("600 22px Grenze"),document.fonts.load("italic 600 22px Grenze")]).catch(()=>{}).finally(boot)}else boot();
})();
</script>
